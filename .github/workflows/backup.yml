name: Auto Backup Naver Blog

on:
  schedule:
    # 1. 매일 자정 (KST 00:00 = UTC 15:00): 새 글 확인 및 최근 글 5개 퇴고 점검
    - cron: '0 15 * * *'
    # 2. 매주 일요일 정오 (KST 12:00 = UTC 03:00): 가장 오래 점검 안 한 과거 글 5개 순환 점검
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택 (daily: 최신글/새글 점검, weekly: 과거글 순환 점검)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run blog sync script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYNC_MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            SYNC_MODE="weekly"
          else
            SYNC_MODE="daily"
          fi
          echo "Executing sync mode: $SYNC_MODE"
          python -u sync_blog.py --mode "$SYNC_MODE"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync: update blog archive and audit state"
            git push
          fi
